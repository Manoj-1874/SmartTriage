<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriorityMed - Set New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #eef6f2;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #1f3b2f;
        }
        .card {
            width: min(92vw, 460px);
            background: #fff;
            border: 1px solid #d9ede5;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(11, 155, 122, 0.12);
            padding: 24px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
        }
        p {
            margin: 0 0 18px;
            color: #4f7062;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c8e2d8;
            border-radius: 10px;
            margin-bottom: 14px;
            font: inherit;
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            background: #0b9b7a;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .hint {
            font-size: 0.92rem;
            color: #4f7062;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set a new password</h1>
        <p>Choose a strong new password for your account.</p>
        <div class="hint">Use at least 8 characters with uppercase, lowercase, number, and special character.</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/reset-password" method="POST">
            <input type="hidden" name="token" value="{{ token }}">

            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit">Update Password</button>
        </form>
    </div>
</body>
</html>
