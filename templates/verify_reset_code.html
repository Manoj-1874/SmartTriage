<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriorityMed - Verify Reset Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #eef6f2;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #1f3b2f;
        }
        .card {
            width: min(92vw, 460px);
            background: #fff;
            border: 1px solid #d9ede5;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(11, 155, 122, 0.12);
            padding: 24px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
        }
        p {
            margin: 0 0 16px;
            color: #4f7062;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c8e2d8;
            border-radius: 10px;
            margin-bottom: 14px;
            font: inherit;
        }
        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            background: #0b9b7a;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .secondary {
            background: #0f766e;
        }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .links {
            margin-top: 8px;
            text-align: center;
        }
        a {
            color: #0b9b7a;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Verify your reset code</h1>
        <p>Enter the 6-digit code sent to your email. The code expires in 10 minutes.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">{{ success }}</div>
        {% endif %}

        <form action="/verify-reset-code" method="POST">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required value="{{ email or '' }}">

            <label for="code">Verification Code</label>
            <input type="text" id="code" name="code" required maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit code">

            <button type="submit">Verify Code</button>
        </form>

        <form action="/forgot-password/resend" method="POST">
            <input type="hidden" name="email" value="{{ email or '' }}">
            <button type="submit" class="secondary">Resend Code</button>
        </form>

        <div class="links">
            <a href="/login">Back to Login</a>
        </div>
    </div>
</body>
</html>
