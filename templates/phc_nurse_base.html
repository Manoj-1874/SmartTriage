<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nurse Portal - PriorityMed{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #0B9B7A;
            --brand-pale: rgba(11, 155, 122, 0.08);
            --bg: #F8FAF9;
            --card: #ffffff;
            --border: rgba(11, 155, 122, 0.12);
            --t-main: #1A2E26;
            --t-muted: #5E7A6F;
            --t-faint: #9DB0A8;
            --glass: rgba(11, 155, 122, 0.03);
            --clr-red: #dc2626;
            --clr-red-bg: rgba(220, 38, 38, 0.08);
            --clr-green: #059669;
            --clr-green-bg: rgba(5, 150, 105, 0.08);
            --sh-card: 0 4px 20px rgba(11, 155, 122, 0.06);
        }
        body {
            background: var(--bg);
            color: var(--t-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: var(--sidebar-w, 280px);
            background: var(--base, #ffffff);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 1000;
        }
        .main-content { flex: 1; min-width: 0; }
        
        /* Unified Sidebar CSS */
        .s-brand { padding: 30px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .s-logo-box { width: 38px; height: 38px; background: var(--brand); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
        .s-brand-name { font-weight: 800; font-size: 18px; color: var(--t-main, #1A2E26); line-height: 1; }
        .s-brand-tag { font-size: 10px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .s-user { padding: 20px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .s-ava { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-pale, rgba(11,155,122,0.1)); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; }
        .s-ava-dot { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; background: #10B981; border: 2px solid #fff; border-radius: 50%; }
        .s-uname { font-weight: 700; font-size: 14px; color: var(--t-main, #1A2E26); }
        .s-urole { font-size: 12px; color: var(--t-muted); margin-top: 2px; text-transform: capitalize; }
        .s-nav { padding: 20px 16px; flex: 1; overflow-y: auto; }
        .s-group { font-size: 11px; font-weight: 700; color: var(--t-muted); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 12px; }
        .s-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; color: var(--t-muted); text-decoration: none; margin-bottom: 4px; font-weight: 600; transition: all 0.2s; font-size: 14px; }
        .s-icon { width: 20px; display: flex; justify-content: center; }
        .s-link:hover { background: var(--brand-pale, rgba(11,155,122,0.05)); color: var(--brand); }
        .s-link.active { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(11, 155, 122, 0.25); }
        .s-link.active .s-icon { color: #fff; }
        .s-toggle { display: none; }
        
        .top-bar {
            height: 80px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .btn-sync {
            background: var(--brand);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        
        /* Shared Components */
        .banner {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }
        .banner-eyebrow { color: var(--brand); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .banner-name { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .banner-sub { color: var(--t-muted); margin-top: 5px; font-size: 14px; }
        
        .mpr-badge { background: var(--glass); border: 1px solid var(--border); color: var(--t-muted); padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    </style>
</head>
<body>
    {% include 'sidebar.html' %}

    <main class="main-content">
        <header class="top-bar">
            <div style="display:flex; align-items:center; gap:20px;">
                <div style="font-size: 14px; font-weight: 600; color: var(--t-muted);">PHC SECTOR: <span style="color:#fff;">Vellode District</span></div>
                <!-- BURDEN REDUCTION PULSE -->
                <div id="timeSavedPulse" style="display:flex; align-items:center; gap:8px; padding:4px 12px; background:rgba(11,155,122,0.1); border:1px solid var(--brand); border-radius:20px; font-size:10px; font-weight:700; color:var(--brand);">
                    <i class="fas fa-bolt"></i> <span id="timeSavedText">~45 MINS SAVED TODAY</span>
                </div>
                <div id="syncPulse" style="display:flex; align-items:center; gap:8px; padding:4px 12px; background:rgba(255,255,255,0.05); border-radius:20px; font-size:10px; font-weight:700;">
                    <div style="width:8px; height:8px; border-radius:50%; background:var(--clr-green); box-shadow:0 0 10px var(--clr-green);"></div>
                    <span id="syncStatusText">CLOUD SYNC ACTIVE</span>
                </div>
            </div>
            <div style="display:flex; gap:15px; align-items:center;">
                <button class="btn" style="background:var(--surface); color:var(--t-muted); font-size:10px; padding:5px 10px;" onclick="generateAutoReport()">
                    <i class="fas fa-magic"></i> Auto-Generate MPR
                </button>
                <div id="universalIdStatus" style="font-size:11px; color:var(--brand);"><i class="fas fa-id-card"></i> ABHA Linked</div>
                <div id="hmisStatus" style="font-size:11px; color:var(--clr-green);"><i class="fas fa-check-circle"></i> Kalangiyam Connected</div>
            </div>
        </header>

        {% block content %}{% endblock %}
    </main>

    <script>
        function generateAutoReport() {
            const btn = document.querySelector('button[onclick="generateAutoReport()"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> MPR Compiled';
                btn.style.color = 'var(--clr-green)';
                alert('Success! The Monthly Progress Report (MPR) has been automatically compiled using this month\'s PHC data. It is ready for Medical Officer review.');
                
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-magic"></i> Auto-Generate MPR';
                    btn.style.color = 'var(--t-muted)';
                }, 3000);
            }, 1500);
        }

        function batchSyncHMIS() {
            const btn = document.querySelector('.btn-sync');
            const status = document.getElementById('hmisStatus');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing Batch...';
            
            fetch('/api/phc/hmis-batch-sync', { method: 'POST' })
            .then(r => {
                if(!r.ok) throw new Error("Server Error");
                return r.json();
            })
            .then(data => {
                alert("SUCCESS: " + data.synced_count + " entries pushed to state portal.");
                btn.innerHTML = '<i class="fas fa-cloud-upload"></i> Batch HMIS Sync';
            })
            .catch(err => {
                alert("Connection failed: " + err.message);
                btn.innerHTML = '<i class="fas fa-cloud-upload"></i> Batch HMIS Sync';
            });
        }
    </script>
</body>
</html>
