<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkup Results — PriorityMed</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --brand:        #0B9B7A;
  --brand-dark:   #087A60;
  --brand-light:  #34C9A5;
  --brand-faint:  #E6F7F3;
  --sidebar-w:    272px;
  --sidebar-col:  72px;
  --radius-sm:    8px;
  --radius-md:    12px;
  --radius-lg:    18px;
  --radius-xl:    26px;
  --ease:         cubic-bezier(.4,0,.2,1);
  --ease-spring:  cubic-bezier(.34,1.56,.64,1);
  --t-fast:       .15s;
  --t-base:       .28s;
}
[data-theme="light"] {
  --canvas:     #EEF6F2;
  --base:       #FFFFFF;
  --surface:    #F5FBF8;
  --hover:      #EBF7F2;
  --border:     #D9EDE5;
  --border-med: #B8D9CC;
  --t-head:     #0A2218;
  --t-body:     #2C4A3C;
  --t-muted:    #5E8C7A;
  --t-faint:    #9DC0B2;
  --sidebar-bg: #FFFFFF;
  --sidebar-ln: #D9EDE5;
  --sh-sm:  0 1px 3px rgba(0,0,0,.06);
  --sh-md:  0 4px 20px rgba(0,0,0,.09);
  --sh-lg:  0 12px 44px rgba(0,0,0,.12);
}
[data-theme="dark"] {
  --canvas:     #091510;
  --base:       #0D1E17;
  --surface:    #112518;
  --hover:      #163020;
  --border:     #1D3528;
  --border-med: #2A4C38;
  --t-head:     #E4F2EB;
  --t-body:     #9ABFAE;
  --t-muted:    #527A65;
  --t-faint:    #2D4D3C;
  --sidebar-bg: #0B1B13;
  --sidebar-ln: #1D3528;
  --sh-sm:  0 1px 3px rgba(0,0,0,.5);
  --sh-md:  0 4px 20px rgba(0,0,0,.55);
  --sh-lg:  0 12px 44px rgba(0,0,0,.65);
  --brand-faint: rgba(11,155,122,.12);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden;scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;font-size:14.5px;line-height:1.65;background:var(--canvas);color:var(--t-body);-webkit-font-smoothing:antialiased;transition:background var(--t-base),color var(--t-base);}
h1,h2,h3,h4{font-family:'Outfit',sans-serif;color:var(--t-head);font-weight:700;line-height:1.2}
a{text-decoration:none;color:inherit}
button{font-family:'Outfit',sans-serif;cursor:pointer}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-med);border-radius:99px}

.shell{display:flex;min-height:100vh;overflow-x:hidden}

/* ══ SIDEBAR ══ */
.sidebar{
  width:var(--sidebar-w);background:var(--sidebar-bg);
  border-right:1px solid var(--sidebar-ln);
  position:fixed;top:0;left:0;bottom:0;z-index:300;
  display:flex;flex-direction:column;overflow:hidden;
  transition:width var(--t-base) var(--ease),background var(--t-base),border-color var(--t-base);
}
.sidebar.collapsed{width:var(--sidebar-col)}
.s-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;border-bottom:1px solid var(--sidebar-ln);flex-shrink:0;}
.s-logo-box{width:38px;height:38px;flex-shrink:0;background:linear-gradient(140deg,var(--brand),var(--brand-light));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;box-shadow:0 4px 14px rgba(11,155,122,.35);transition:transform var(--t-fast);}
.s-logo-box:hover{transform:scale(1.08)}
.s-brand-text{overflow:hidden;transition:opacity var(--t-base),width var(--t-base)}
.sidebar.collapsed .s-brand-text{opacity:0;width:0}
.s-brand-name{font-size:16px;font-weight:800;color:var(--t-head);letter-spacing:-.3px;white-space:nowrap}
.s-brand-tag{font-size:10px;color:var(--brand);font-weight:600;white-space:nowrap;margin-top:1px}
.s-toggle{position:absolute;top:22px;right:-13px;width:26px;height:26px;background:var(--base);border:1px solid var(--border-med);border-radius:50%;color:var(--t-muted);font-size:10px;display:flex;align-items:center;justify-content:center;z-index:10;box-shadow:var(--sh-sm);transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);}
.s-toggle:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.sidebar.collapsed .s-toggle i{transform:rotate(180deg)}
.s-user{margin:12px 10px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);display:flex;align-items:center;gap:10px;overflow:hidden;transition:background var(--t-base),border-color var(--t-base);}
.s-ava{width:36px;height:36px;flex-shrink:0;background:linear-gradient(135deg,var(--brand),var(--brand-light));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;position:relative;}
.s-ava-dot{position:absolute;bottom:0;right:0;width:9px;height:9px;background:#22C55E;border-radius:50%;border:2px solid var(--sidebar-bg);}
.s-user-text{overflow:hidden;transition:opacity var(--t-base),width var(--t-base)}
.sidebar.collapsed .s-user-text{opacity:0;width:0}
.s-uname{font-size:13px;font-weight:700;color:var(--t-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-urole{font-size:11px;color:var(--brand);font-weight:500;margin-top:1px}
.s-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 8px}
.s-group{font-size:9.5px;font-weight:700;color:var(--t-faint);text-transform:uppercase;letter-spacing:1.2px;padding:10px 10px 4px;white-space:nowrap;transition:opacity var(--t-base),height var(--t-base),padding var(--t-base);}
.sidebar.collapsed .s-group{opacity:0;height:0;overflow:hidden;padding:0}
.s-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--t-muted);font-size:13.5px;font-weight:500;margin-bottom:2px;white-space:nowrap;transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast);}
.s-link:hover{background:var(--hover);color:var(--t-head);transform:translateX(2px)}
.s-link.active{background:var(--brand-faint);color:var(--brand-dark);font-weight:700}
[data-theme="dark"] .s-link.active{background:rgba(11,155,122,.15);color:var(--brand-light)}
.s-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.s-link.active .s-icon{background:rgba(11,155,122,.15);color:var(--brand)}
.s-label{transition:opacity var(--t-base),width var(--t-base)}
.sidebar.collapsed .s-label{opacity:0;width:0;overflow:hidden}
.s-chip{margin-left:auto;background:var(--brand-faint);color:var(--brand);font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;transition:opacity var(--t-base);}
.sidebar.collapsed .s-chip{opacity:0;width:0;overflow:hidden}
.s-footer{padding:10px 10px 14px;border-top:1px solid var(--sidebar-ln);flex-shrink:0;}
.s-status{display:flex;align-items:center;gap:8px;padding:8px 11px;background:rgba(22,163,74,.08);border-radius:var(--radius-sm);overflow:hidden;}
.s-dot{width:7px;height:7px;border-radius:50%;background:#16A34A;flex-shrink:0;animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.4)}50%{box-shadow:0 0 0 5px rgba(22,163,74,0)}}
.s-status-txt{font-size:11px;font-weight:600;color:#16A34A;white-space:nowrap;transition:opacity var(--t-base),width var(--t-base)}
.sidebar.collapsed .s-status-txt{opacity:0;width:0;overflow:hidden}

/* ══ MAIN ══ */
.main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w));min-width:0;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;transition:margin-left var(--t-base) var(--ease),width var(--t-base) var(--ease);}
.sidebar.collapsed~.main{margin-left:var(--sidebar-col);width:calc(100% - var(--sidebar-col));}

/* ══ TOPBAR ══ */
.topbar{position:sticky;top:0;z-index:200;height:60px;padding:0 32px;width:100%;background:var(--base);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh-sm);transition:background var(--t-base),border-color var(--t-base);}
.t-breadcrumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t-muted);}
.t-breadcrumb-active{color:var(--brand);font-weight:700}
.t-sep{color:var(--t-faint);font-size:9px}
.t-right{display:flex;align-items:center;gap:8px;}
.t-clock{font-size:12.5px;font-weight:600;color:var(--t-muted);padding:5px 12px;background:var(--surface);border:1px solid var(--border);border-radius:99px;font-variant-numeric:tabular-nums;transition:background var(--t-base),border-color var(--t-base);}
.theme-pill{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 12px;background:var(--surface);border:1px solid var(--border);border-radius:99px;cursor:pointer;font-size:12px;font-weight:600;color:var(--t-muted);transition:all var(--t-fast);user-select:none;}
.theme-pill:hover{background:var(--hover);color:var(--t-head);border-color:var(--border-med)}
.t-track{width:32px;height:17px;background:var(--border-med);border-radius:99px;position:relative;transition:background var(--t-base);}
[data-theme="dark"] .t-track{background:var(--brand)}
.t-thumb{width:11px;height:11px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:transform var(--t-base) var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2);}
[data-theme="dark"] .t-thumb{transform:translateX(15px)}
.t-btn{width:36px;height:36px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--t-muted);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all var(--t-fast);position:relative;}
.t-btn:hover{background:var(--hover);color:var(--t-head);border-color:var(--border-med)}
.t-badge{position:absolute;top:5px;right:5px;width:7px;height:7px;background:#DC2626;border-radius:50%;border:1.5px solid var(--base);}

/* ══ PAGE ══ */
.page{padding:32px 32px 64px;flex:1;min-width:0;overflow-x:hidden;width:100%;}

/* ══ RESULT HERO ══ */
.result-hero{
  border-radius:var(--radius-xl);overflow:hidden;
  margin-bottom:28px;position:relative;
  animation:fadeUp .5s var(--ease) both;
}
.result-hero.risk-high{background:linear-gradient(135deg, #7F1D1D, #991B1B, #B91C1C, #DC2626);}
.result-hero.risk-critical{background:linear-gradient(135deg, #450a0a, #7f1d1d, #991b1b, #dc2626, #ef4444);}
.result-hero.risk-medium{background:linear-gradient(135deg, #78350F, #92400E, #B45309, #D97706);}
.result-hero.risk-low{background:linear-gradient(135deg, #064E3B, #065F46, #047857, #059669);}

.rh-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 85% 15%, rgba(255,255,255,.1) 0%, transparent 55%),radial-gradient(ellipse at 15% 85%, rgba(0,0,0,.1) 0%, transparent 45%);pointer-events:none;}
.rh-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at 50% 50%,black 20%,transparent 70%);pointer-events:none;}
.rh-orb{position:absolute;right:-80px;top:-80px;width:360px;height:360px;border-radius:50%;animation:orbFloat 8s ease-in-out infinite;pointer-events:none;}
.risk-critical .rh-orb{background:radial-gradient(circle,rgba(239,68,68,.35) 0%,rgba(220,38,38,.2) 40%,transparent 65%);animation:orbPulse 1.2s ease-in-out infinite;}
.risk-high .rh-orb{background:radial-gradient(circle,rgba(239,68,68,.2) 0%,transparent 65%);}
.risk-medium .rh-orb{background:radial-gradient(circle,rgba(245,158,11,.2) 0%,transparent 65%);}
.risk-low .rh-orb{background:radial-gradient(circle,rgba(16,185,129,.2) 0%,transparent 65%);}
@keyframes orbPulse{0%,100%{transform:scale(.95)}50%{transform:scale(1.05)}}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.06)}}
.rh-rings{position:absolute;right:60px;top:50%;transform:translateY(-50%);width:220px;height:220px;pointer-events:none;}
.rh-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.1);}
.rh-ring1{inset:0;}
.rh-ring2{inset:25px;}
.rh-ring3{inset:50px;}
.rh-ring4{inset:75px;}

.rh-content{position:relative;z-index:1;padding:50px 48px;display:flex;align-items:center;gap:48px;}
.rh-icon-section{flex-shrink:0;text-align:center;}
.rh-icon-ring{
  width:110px;height:110px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  position:relative;margin:0 auto 16px;
  animation:iconRingPulse 2.5s ease-in-out infinite;
}
@keyframes iconRingPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.15)}
  50%{box-shadow:0 0 0 20px rgba(255,255,255,0)}
}
.rh-icon-ring::before{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(255,255,255,.1);
  animation:iconRingPulse 2.5s ease-in-out infinite .5s;
}
.rh-icon-inner{
  width:82px;height:82px;border-radius:50%;
  background:rgba(255,255,255,.15);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;color:#fff;
}
.rh-risk-badge{
  display:inline-block;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.25);
  padding:6px 16px;border-radius:99px;
  font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;
}
.rh-text{flex:1;min-width:0;}
.rh-eyebrow{font-size:11px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.rh-eyebrow-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);}
.rh-title{font-family:'Outfit',sans-serif;font-size:38px;font-weight:800;color:#fff;margin-bottom:8px;line-height:1.1;letter-spacing:-.5px;}
.rh-sub{font-size:14.5px;color:rgba(255,255,255,.72);margin-bottom:22px;line-height:1.55;max-width:480px;}
.rh-routing{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.2);
  padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:700;color:#fff;
  margin-bottom:22px;
}
.rh-meta{display:flex;gap:12px;flex-wrap:wrap;}
.rh-meta-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  padding:7px 14px;border-radius:99px;
  font-size:11.5px;font-weight:600;color:rgba(255,255,255,.85);
}
.rh-score{flex-shrink:0;text-align:center;position:relative;z-index:1;}
.rh-score-ring{width:130px;height:130px;position:relative;margin:0 auto;}
.rh-score-ring svg{transform:rotate(-90deg);}
.rh-score-ring circle.bg{stroke:rgba(255,255,255,.1);fill:none;stroke-width:8;}
.rh-score-ring circle.fg{fill:none;stroke-width:8;stroke-linecap:round;stroke:rgba(255,255,255,.8);stroke-dasharray:346;stroke-dashoffset:346;transition:stroke-dashoffset 1.5s var(--ease);}
.rh-score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rh-score-val{font-size:30px;font-weight:900;color:#fff;line-height:1;}
.rh-score-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.6);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}

/* ══ ALERT BANNER ══ */
.alert-banner{
  display:flex;align-items:flex-start;gap:16px;
  border-radius:var(--radius-lg);padding:20px 24px;
  margin-bottom:24px;
  animation:fadeUp .4s var(--ease) .1s both;
  transition:background var(--t-base),border-color var(--t-base);
}
.ab-high{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);}
.ab-critical{background:rgba(239,68,68,.12);border:2px solid rgba(239,68,68,.4);}
.ab-medium{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);}
.ab-low{background:rgba(22,163,74,.06);border:1px solid rgba(22,163,74,.2);}
.ab-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.ab-high .ab-icon{background:rgba(239,68,68,.1);color:#DC2626;}
.ab-critical .ab-icon{background:rgba(239,68,68,.2);color:#EF4444;}
.ab-medium .ab-icon{background:rgba(245,158,11,.1);color:#D97706;}
.ab-low .ab-icon{background:rgba(22,163,74,.1);color:#16A34A;}
.ab-body{flex:1;}
.ab-title{font-size:15px;font-weight:800;color:var(--t-head);margin-bottom:4px;}
.ab-high .ab-title{color:#DC2626;}
.ab-critical .ab-title{color:#EF4444;}
.ab-medium .ab-title{color:#D97706;}
.ab-low .ab-title{color:#16A34A;}
.ab-text{font-size:13px;color:var(--t-body);line-height:1.55;}

/* ══ MAIN GRID ══ */
.results-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;animation:fadeUp .4s var(--ease) .15s both;}

/* ══ LEFT COLUMN ══ */
.results-left{display:flex;flex-direction:column;gap:20px;}

/* Vitals card */
.card{background:var(--base);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--sh-sm);overflow:hidden;transition:background var(--t-base),border-color var(--t-base);}
.card:hover{border-color:var(--border-med);}
.card-head{padding:22px 26px 0;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.card-title{font-size:16px;font-weight:700;color:var(--t-head);}
.card-sub{font-size:12px;color:var(--t-muted);margin-top:2px;}
.card-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:var(--brand-faint);color:var(--brand);padding:5px 11px;border-radius:99px;}
[data-theme="dark"] .card-pill{background:rgba(11,155,122,.15);color:var(--brand-light)}
.card-body{padding:0 26px 24px;}

/* Vitals grid */
.vitals-display{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.vital-display-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-md);padding:20px 16px;
  text-align:center;position:relative;overflow:hidden;
  transition:all var(--t-base);
}
.vital-display-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--border-med);}
.vital-display-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  border-radius:var(--radius-md) var(--radius-md) 0 0;
}
.vd-bp::before{background:linear-gradient(90deg,#3B82F6,#60A5FA)}
.vd-hr::before{background:linear-gradient(90deg,#EF4444,#F87171)}
.vd-tmp::before{background:linear-gradient(90deg,#F59E0B,#FCD34D)}
.vd-rr::before{background:linear-gradient(90deg,#8B5CF6,#A78BFA)}
.vd-spo2::before{background:linear-gradient(90deg,#06B6D4,#67E8F9)}
.vd-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 auto 12px;}
.vd-val{font-size:22px;font-weight:800;color:var(--t-head);line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums;}
.vd-lbl{font-size:10.5px;color:var(--t-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.vd-status{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;}
.vs-normal{background:rgba(22,163,74,.1);color:#16A34A;}
.vs-elevated{background:rgba(245,158,11,.1);color:#D97706;}
.vs-high{background:rgba(239,68,68,.1);color:#DC2626;}
.vs-low{background:rgba(59,130,246,.1);color:#2563EB;}

/* Vital gauge */
.vd-gauge{width:100%;height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px;}
.vd-gauge-fill{height:100%;border-radius:99px;transition:width 1.2s var(--ease);}

/* Symptoms */
.symptoms-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:20px;transition:background var(--t-base),border-color var(--t-base);}
.sc-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t-faint);margin-bottom:10px;}
.sc-text{font-size:14px;color:var(--t-body);line-height:1.65;}
.symptom-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:var(--brand-faint);color:var(--brand-dark);border-radius:99px;font-size:11.5px;font-weight:600;margin:3px;transition:background var(--t-base);}
[data-theme="dark"] .symptom-tag{background:rgba(11,155,122,.15);color:var(--brand-light);}

/* Timeline visualization */
.risk-timeline{padding:0 4px;}
.rt-label{font-size:11px;font-weight:700;color:var(--t-faint);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;}
.rt-track{position:relative;height:8px;background:linear-gradient(90deg,#22C55E 0%,#84CC16 25%,#EAB308 50%,#F97316 75%,#EF4444 100%);border-radius:99px;margin-bottom:20px;}
.rt-marker{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:20px;height:20px;border-radius:50%;
  background:#fff;border:3px solid var(--brand);
  box-shadow:0 0 0 5px rgba(11,155,122,.2);
  transition:left 1.5s var(--ease);
}
.rt-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--t-faint);font-weight:600;}

/* Recommendations */
.rec-list{display:flex;flex-direction:column;gap:10px;}
.rec-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 16px;border-radius:var(--radius-md);
  border:1px solid var(--border);background:var(--surface);
  transition:all var(--t-fast);
}
.rec-item:hover{transform:translateX(4px);border-color:var(--brand);background:var(--base);}
.rec-num{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex-shrink:0;
  background:var(--brand-faint);color:var(--brand);
}
[data-theme="dark"] .rec-num{background:rgba(11,155,122,.15);color:var(--brand-light);}
.rec-text{font-size:13px;color:var(--t-body);line-height:1.55;padding-top:3px;}
.rec-text strong{color:var(--t-head);font-weight:700;}

/* ══ RIGHT COLUMN ══ */
.results-right{display:flex;flex-direction:column;gap:18px;position:sticky;top:80px;}

/* Action card */
.action-card{
  background:var(--base);border:1px solid var(--border);
  border-radius:var(--radius-xl);overflow:hidden;
  box-shadow:var(--sh-md);
  transition:background var(--t-base),border-color var(--t-base);
}
.ac-header{
  padding:24px;text-align:center;
  background:linear-gradient(135deg,#064E3B,#065F46);
  position:relative;overflow:hidden;
}
.ac-header-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(16,185,129,.2) 0%,transparent 55%);pointer-events:none;}
.ac-header h3{font-size:15px;font-weight:800;color:#fff;margin-bottom:4px;position:relative;z-index:1;}
.ac-header p{font-size:11.5px;color:rgba(255,255,255,.65);position:relative;z-index:1;}
.ac-body{padding:20px;}
.btn-full{
  width:100%;padding:14px;border:none;border-radius:var(--radius-md);
  font-size:13.5px;font-weight:800;font-family:'Outfit',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;transition:all var(--t-fast);margin-bottom:10px;
}
.btn-full:last-child{margin-bottom:0;}
.btn-primary-full{
  background:linear-gradient(135deg,var(--brand),#059669);color:#fff;
  box-shadow:0 4px 16px rgba(11,155,122,.3);
}
.btn-primary-full:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,155,122,.4);color:#fff;}
.btn-high-full{
  background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;
  box-shadow:0 4px 16px rgba(220,38,38,.3);
}
.btn-high-full:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(220,38,38,.4);color:#fff;}
.btn-outline-full{
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--t-muted);
}
.btn-outline-full:hover{background:var(--hover);border-color:var(--border-med);color:var(--t-head);}

/* Score breakdown */
.score-card{background:var(--base);border:1px solid var(--border);border-radius:var(--radius-xl);padding:22px;box-shadow:var(--sh-sm);transition:background var(--t-base),border-color var(--t-base);}
.sc2-title{font-size:14px;font-weight:700;color:var(--t-head);margin-bottom:4px;}
.sc2-sub{font-size:11.5px;color:var(--t-muted);margin-bottom:18px;}
.score-factor{margin-bottom:14px;}
.sf-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.sf-name{font-size:12.5px;font-weight:600;color:var(--t-body);}
.sf-val{font-size:12px;font-weight:700;}
.sf-bar-wrap{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.sf-bar{height:100%;border-radius:99px;transition:width 1.2s var(--ease);}
.sf-green{color:#16A34A;}.sf-bar.bg-green{background:#22C55E;}
.sf-amber{color:#D97706;}.sf-bar.bg-amber{background:#FBBF24;}
.sf-red{color:#DC2626;}.sf-bar.bg-red{background:#F87171;}

/* Next steps */
.next-card{background:var(--base);border:1px solid var(--border);border-radius:var(--radius-xl);padding:22px;box-shadow:var(--sh-sm);transition:background var(--t-base),border-color var(--t-base);}
.next-step-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);transition:border-color var(--t-base);}
.next-step-item:last-child{border-bottom:none;padding-bottom:0;}
.ns-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.ns-text{flex:1;min-width:0;}
.ns-title{font-size:13px;font-weight:700;color:var(--t-head);}
.ns-sub{font-size:11px;color:var(--t-muted);margin-top:1px;}
.ns-arrow{color:var(--t-faint);font-size:11px;}

/* Disclaimer */
.disclaimer{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:14px 16px;
  font-size:11.5px;color:var(--t-faint);line-height:1.55;
  transition:background var(--t-base),border-color var(--t-base);
}
.disclaimer i{color:var(--t-faint);margin-right:4px;}

/* Print button */
.btn-print{
  width:100%;padding:10px;background:none;border:1.5px dashed var(--border);
  border-radius:var(--radius-sm);font-size:12px;font-weight:600;
  color:var(--t-muted);font-family:'Outfit',sans-serif;cursor:pointer;
  transition:all var(--t-fast);display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-print:hover{border-color:var(--brand);color:var(--brand);}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ══ NO RESULT STATE ══ */
.empty-state{text-align:center;padding:80px 32px;animation:fadeUp .5s var(--ease) both;}
.es-icon{width:88px;height:88px;margin:0 auto 20px;background:var(--surface);border:1px solid var(--border);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--t-faint);animation:floatIco 3s ease-in-out infinite;}
@keyframes floatIco{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.es-title{font-size:22px;font-weight:800;color:var(--t-head);margin-bottom:8px;}
.es-sub{font-size:14px;color:var(--t-muted);max-width:340px;margin:0 auto 24px;line-height:1.6;}
.btn-start{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:var(--brand);color:#fff;border-radius:var(--radius-md);font-size:14px;font-weight:700;font-family:'Outfit',sans-serif;box-shadow:0 4px 16px rgba(11,155,122,.3);transition:all var(--t-fast);}
.btn-start:hover{background:var(--brand-dark);color:#fff;transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,155,122,.4);}

/* ══ RESPONSIVE ══ */
@media(max-width:1100px){.results-grid{grid-template-columns:1fr}.results-right{position:static;flex-direction:row;flex-wrap:wrap;}.results-right>*{flex:1;min-width:260px;}}
@media(max-width:900px){.vitals-display{grid-template-columns:1fr 1fr 1fr;}.rh-score{display:none;}.rh-content{padding:32px 28px;}}
@media(max-width:768px){
  .main{margin-left:0!important;width:100%!important}
  .sidebar{transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .page{padding:20px 16px 52px}
  .rh-content{flex-direction:column;gap:28px;padding:28px 22px;}
  .rh-title{font-size:28px}
  .vitals-display{grid-template-columns:1fr;}
}
@media print{.sidebar,.topbar,.results-right{display:none!important}.main{margin-left:0!important;width:100%!important}.page{padding:0!important}}
</style>
</head>
<body>
<div class="shell">

<!-- ══ SIDEBAR ══ -->
{% include 'sidebar.html' %}

<!-- ══ MAIN ══ -->
<div class="main" id="mainContent">
  <header class="topbar">
    <div class="t-breadcrumb">
      <span>PriorityMed</span>
      <span class="t-sep"><i class="fas fa-chevron-right"></i></span>
      <span>AI Checkup</span>
      <span class="t-sep"><i class="fas fa-chevron-right"></i></span>
      <span class="t-breadcrumb-active">Results</span>
    </div>
    {% if user and user.role != 'doctor' %}
    <div class="t-right">
      <div class="t-clock" id="liveClock">--:-- --</div>
      <div class="theme-pill" id="themeToggle">
        <i class="fas fa-moon" id="themeIco" style="font-size:11px;"></i>
        <div class="t-track"><div class="t-thumb"></div></div>
      </div>
      <button class="t-btn"><i class="fas fa-bell"></i><div class="t-badge"></div></button>
      <button class="t-btn" onclick="window.print()"><i class="fas fa-print"></i></button>
    </div>
    {% endif %}
  </header>

  <div class="page">

    <!-- ══ JS-DRIVEN RESULT (Dynamic from Flask) ══ -->
    <div id="resultData" style="display:none;" data-result='{{ result | tojson }}'></div>

    <div id="resultView"></div>

    <!-- No result state (shown if no data) -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="es-icon"><i class="fas fa-stethoscope"></i></div>
      <h2 class="es-title">No Assessment Found</h2>
      <p class="es-sub">Please complete an AI health checkup first to view your personalized assessment results.</p>
      <a href="/checkup" class="btn-start"><i class="fas fa-heartbeat"></i> Start AI Checkup</a>
    </div>

  </div>
</div>
</div>

<script>
/* THEME */
const html = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const themeIco = document.getElementById('themeIco');
function setTheme(t) { html.setAttribute('data-theme',t); localStorage.setItem('pmTheme',t); themeIco.className=(t==='dark'?'fas fa-sun':'fas fa-moon'); themeIco.style.fontSize='11px'; }
(function(){ setTheme(localStorage.getItem('pmTheme')||'light'); })();
themeToggle.addEventListener('click',()=>setTheme(html.getAttribute('data-theme')==='dark'?'light':'dark'));

/* SIDEBAR */
const sidebar = document.getElementById('sidebar');
document.getElementById('sidebarToggle').addEventListener('click',()=>{sidebar.classList.toggle('collapsed');localStorage.setItem('pmSide',sidebar.classList.contains('collapsed'));});
if(localStorage.getItem('pmSide')==='true') sidebar.classList.add('collapsed');

/* CLOCK */
function tick(){ const el=document.getElementById('liveClock'); if(el) el.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
setInterval(tick,1000); tick();

/* BUILD RESULT UI */
function buildResult(result) {
  const risk = (result.risk_level||'').toUpperCase();
  const isCritical = risk.includes('CRITICAL');
  const isHigh   = risk.includes('HIGH') || isCritical;
  const isMedium = risk.includes('MEDIUM');
  const isLow    = !isCritical && !isHigh && !isMedium;
  const riskClass = isCritical ? 'risk-critical' : isHigh ? 'risk-high' : isMedium ? 'risk-medium' : 'risk-low';
  const score = result.score || (isCritical ? 95 : isHigh ? 78 : isMedium ? 54 : 22);
  const scoreOffset = 346 - (346 * score / 100);

  const alertClass  = isCritical ? 'ab-critical' : isHigh ? 'ab-high'   : isMedium ? 'ab-medium'   : 'ab-low';
  const alertIcon   = isCritical ? 'fa-skull-crossbones' : isHigh ? 'fa-triangle-exclamation' : isMedium ? 'fa-circle-exclamation' : 'fa-circle-check';
  const alertTitle  = isCritical ? '🚨 CRITICAL - Emergency Medical Attention Required IMMEDIATELY' : isHigh ? '⚠ Immediate Medical Attention Required' : isMedium ? 'Medical Consultation Advised' : 'Your Vitals Appear Normal';
  const alertText   = isCritical
    ? 'Your assessment indicates a CRITICAL health condition. CALL EMERGENCY SERVICES (911/Ambulance) IMMEDIATELY. Do not wait. Do not drive yourself. This requires emergency intervention now.'
    : isHigh
    ? 'Your assessment indicates high-risk health indicators. Please seek emergency or urgent medical care as soon as possible. Do not delay — call your doctor or visit an emergency department.'
    : isMedium
    ? 'Your symptoms and vitals suggest a condition that warrants professional evaluation. We recommend booking an appointment with a doctor within 24–48 hours.'
    : 'Your health indicators are within normal ranges. Continue your healthy lifestyle habits and monitor for any changes. See a doctor if symptoms persist or worsen.';

  const bpParts = (result.vitals?.bp || '120/80').split('/');
  const sys = parseInt(bpParts[0]) || 120;
  const dia = parseInt(bpParts[1]) || 80;
  const hr  = parseInt(result.vitals?.hr) || 72;
  const tmp = parseFloat(result.vitals?.temp) || 98.6;
  const rr  = parseInt(result.vitals?.respiration_rate) || 16;
  const spo2 = parseInt(result.vitals?.spo2) || 98;

  function bpStatus(s){ if(s<90)return['low','Low'];if(s<=120)return['normal','Normal'];if(s<=130)return['elevated','Elevated'];return['high','High']; }
  function hrStatus(h){ if(h<60)return['low','Low'];if(h<=100)return['normal','Normal'];return['elevated','Tachycardia']; }
  function tmpStatus(t){ if(t<97)return['low','Hypothermic'];if(t<=99)return['normal','Normal'];if(t<=100.4)return['elevated','Low-grade Fever'];return['high','Fever']; }
  function rrStatus(r){ if(r<12)return['low','Low'];if(r<=20)return['normal','Normal'];if(r<=24)return['elevated','Elevated'];return['high','Critical']; }
  function spo2Status(s){ if(s>=95)return['normal','Normal'];if(s>=92)return['elevated','Low'];return['high','Hypoxemia']; }

  const [bpSt,bpLbl] = bpStatus(sys);
  const [hrSt,hrLbl] = hrStatus(hr);
  const [tSt,tLbl]   = tmpStatus(tmp);
  const [rrSt,rrLbl] = rrStatus(rr);
  const [spo2St,spo2Lbl] = spo2Status(spo2);

  const bpPct  = Math.min(100,((sys-70)/(200-70))*100);
  const hrPct  = Math.min(100,((hr-40)/(200-40))*100);
  const tmpPct = Math.min(100,((tmp-95)/(108-95))*100);
  const rrPct  = Math.min(100,((rr-8)/(35-8))*100);
  const spo2Pct = Math.min(100,Math.max(0,((spo2-85)/(100-85))*100));

  function gaugeColor(st){ return st==='normal'?'#22C55E':st==='low'?'#3B82F6':st==='elevated'?'#F59E0B':'#EF4444'; }

  const recommendations = isCritical ? [
    {title:'🚨 CALL 911 OR EMERGENCY SERVICES IMMEDIATELY', sub:'Do not wait. Do not self-treat. Emergency transport required now.'},
    {title:'Do Not Drive Yourself', sub:'Call an ambulance. Ask emergency responders for immediate transport to nearest hospital with ICU capability.'},
    {title:'Inform Family/Emergency Contact', sub:'Let someone know what is happening and where you are being taken.'},
    {title:'Bring All Medical Records', sub:'If conscious, bring insurance card, medication list, and any recent test results.'},
  ] : isHigh ? [
    {title:'Call Emergency Services or Go to ED', sub:'Conditions rated HIGH require immediate in-person evaluation.'},
    {title:'Do Not Drive Yourself', sub:'Ask someone to accompany you or call an ambulance.'},
    {title:'Keep a Vitals Log', sub:'Record your BP, HR and temperature every 30 minutes until care is received.'},
    {title:'Avoid Food & Drink', sub:'If emergency surgery may be needed, fasting is important.'},
  ] : isMedium ? [
    {title:'Book a Doctor Appointment Within 48 Hours', sub:'A GP or urgent care physician should evaluate your condition.'},
    {title:'Rest and Stay Hydrated', sub:'Drink 8+ glasses of water and avoid strenuous physical activity.'},
    {title:'Monitor Your Symptoms', sub:'Note any worsening of symptoms, especially fever above 101°F or chest pain.'},
    {title:'Avoid Self-Medicating', sub:'Don\'t start new medications without professional guidance.'},
  ] : [
    {title:'Continue Your Healthy Routine', sub:'Maintain your current diet, exercise, and sleep schedule.'},
    {title:'Schedule a Routine Checkup', sub:'Annual physicals help catch issues before they become serious.'},
    {title:'Track Your Vitals Weekly', sub:'Use a home BP monitor and keep a personal health log.'},
    {title:'Stay Preventively Healthy', sub:'Vaccinations, screenings, and dental exams keep you ahead of illness.'},
  ];

  const scoreFactors = [
    {name:'Vital Signs',pct:isCritical?95:isHigh?78:isMedium?55:20,cls:isCritical?'critical':isHigh?'red':isMedium?'amber':'green'},
    {name:'Symptom Severity',pct:isCritical?98:isHigh?82:isMedium?60:15,cls:isCritical?'critical':isHigh?'red':isMedium?'amber':'green'},
    {name:'Medical History Risk',pct:isCritical?88:isHigh?65:isMedium?45:25,cls:isCritical?'critical':isHigh?'amber':isMedium?'amber':'green'},
    {name:'Duration & Onset',pct:isCritical?92:isHigh?70:isMedium?50:10,cls:isCritical?'critical':isHigh?'red':isMedium?'amber':'green'},
  ];

  const nextSteps = [
    {ico:'fa-calendar-check',color:'#3B82F6',bg:'rgba(59,130,246,.1)',title:'Book Appointment',sub:'Schedule with a specialist',href:'/appointments'},
    {ico:'fa-rotate-left',color:'#8B5CF6',bg:'rgba(139,92,246,.1)',title:'Retake Checkup',sub:'Update your assessment',href:'/checkup'},
    {ico:'fa-home',color:'#F59E0B',bg:'rgba(245,158,11,.1)',title:'Return to Dashboard',sub:'Back to your overview',href:'/patient/dashboard'},
  ];

  const symTags = (result.symptoms||'').split(/[,.\n]+/).map(s=>s.trim()).filter(s=>s.length>2&&s.length<40).slice(0,6);

  const html2 = `
  <!-- HERO -->
  <div class="result-hero ${riskClass}">
    <div class="rh-bg"></div>
    <div class="rh-grid"></div>
    <div class="rh-orb"></div>
    <div class="rh-rings">
      <div class="rh-ring rh-ring1"></div>
      <div class="rh-ring rh-ring2"></div>
      <div class="rh-ring rh-ring3"></div>
      <div class="rh-ring rh-ring4"></div>
    </div>
    <div class="rh-content">
      <div class="rh-icon-section">
        <div class="rh-icon-ring">
          <div class="rh-icon-inner">
            <i class="fas ${isHigh?'fa-triangle-exclamation':isMedium?'fa-circle-exclamation':'fa-shield-heart'}"></i>
          </div>
        </div>
        <div class="rh-risk-badge">${risk} RISK</div>
      </div>
      <div class="rh-text">
        <div class="rh-eyebrow"><div class="rh-eyebrow-dot"></div> AI Health Assessment Complete</div>
        <h1 class="rh-title">${isHigh?'Urgent Attention':isMedium?'Care Recommended':'You\'re Looking Good'}</h1>
        <p class="rh-sub">${isHigh?'Your vitals and symptoms indicate high-risk conditions that require prompt medical evaluation.':isMedium?'Your assessment suggests a moderate health concern. A doctor consultation is recommended soon.':'Your vitals are within healthy ranges. Keep maintaining your wellness habits.'}</p>
        <div class="rh-routing"><i class="fas fa-hospital-user"></i> Recommended: ${result.routing||'General Practitioner'}</div>
        <div class="rh-routing" style="margin-top:10px;"><i class="fas fa-user-md"></i> Specialist: ${result.recommended_specialist||'General Medicine'}</div>
        <div class="rh-meta">
          <div class="rh-meta-pill"><i class="fas fa-brain" style="font-size:10px;"></i> AI-Powered Analysis</div>
          <div class="rh-meta-pill"><i class="fas fa-notes-medical" style="font-size:10px;"></i> NEWS2: ${result.news2_score ?? 'N/A'}</div>
          <div class="rh-meta-pill"><i class="fas fa-clock" style="font-size:10px;"></i> ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
          <div class="rh-meta-pill"><i class="fas fa-lock" style="font-size:10px;"></i> Encrypted & Secure</div>
        </div>
      </div>
      <div class="rh-score">
        <div class="rh-score-ring">
          <svg viewBox="0 0 120 120" width="130" height="130">
            <circle class="bg" cx="60" cy="60" r="55"/>
            <circle class="fg" cx="60" cy="60" r="55" id="scoreCircle" style="stroke-dashoffset:${scoreOffset};"/>
          </svg>
          <div class="rh-score-center">
            <div class="rh-score-val" id="scoreVal">0</div>
            <div class="rh-score-lbl">Risk Score</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ALERT BANNER -->
  <div class="alert-banner ${alertClass}">
    <div class="ab-icon"><i class="fas ${alertIcon}"></i></div>
    <div class="ab-body">
      <div class="ab-title">${alertTitle}</div>
      <div class="ab-text">${alertText}</div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="results-grid">
    <div class="results-left">

      <!-- VITALS CARD -->
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">Vital Signs Overview</div>
            <div class="card-sub">Measured values vs. reference ranges</div>
          </div>
          <div class="card-pill"><i class="fas fa-heartbeat"></i> Live Reading</div>
        </div>
        <div class="card-body">
          <div class="vitals-display">
            <div class="vital-display-card vd-bp">
              <div class="vd-ico" style="background:rgba(59,130,246,.1);"><i class="fas fa-tachometer-alt" style="color:#3B82F6;"></i></div>
              <div class="vd-val">${result.vitals?.bp||'—'}</div>
              <div class="vd-lbl">Blood Pressure</div>
              <div class="vd-status vs-${bpSt}"><i class="fas fa-circle" style="font-size:6px;"></i>${bpLbl}</div>
              <div class="vd-gauge"><div class="vd-gauge-fill" style="width:0%;background:${gaugeColor(bpSt)};" data-w="${bpPct}%"></div></div>
            </div>
            <div class="vital-display-card vd-hr">

window.addEventListener('DOMContentLoaded',()=>{
  const dataEl = document.getElementById('resultData');
  let result = null;
  try { result = JSON.parse(dataEl.dataset.result||'null'); } catch(e){}
  if(result){ buildResult(result); }
  else { document.getElementById('emptyState').style.display='block'; }
});
async function dispatchAmbulance(patientId, destName) {
  if(!confirm('Are you sure you want to dispatch an emergency ambulance for this patient?')) return;
  try {
    const res = await fetch('/api/phc/allocate_ambulance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        patient_id: patientId,
        destination: destName || 'PHC Central'
      })
    });
    const data = await res.json();
    if(data.success) {
      alert('🚑 Ambulance Dispatched Successfully! Tracking has begun.');
      window.location.reload();
    } else {
      alert('Failed to dispatch ambulance: ' + (data.message || 'No available ambulances'));
    }
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function viewDistrictResources() {
  try {
    const res = await fetch('/api/phc/district-resources');
    const data = await res.json();
    if(data.success) {
      let msg = "🏥 DISTRICT FACILITY CAPACITIES:\n\n";
      data.facilities.forEach(f => {
        msg += `${f.name}:\n  🛏️ Available Beds: ${f.beds}  |  💨 Oxygen Cylinders: ${f.oxygen}\n\n`;
      });
      alert(msg);
    }
  } catch(e) {
    alert('Error fetching resources');
  }
}
