<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulance Tracking — DDHS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
    :root {
        --brand: #0B9B7A;
        --brand-dark: #087A60;
        --radius-md: 12px;
        --ease: cubic-bezier(.4,0,.2,1);
    }
    [data-theme="light"] {
        --canvas: #EEF6F2;
        --base: #FFFFFF;
        --surface: #F5FBF8;
        --border: #D9EDE5;
        --t-head: #0A2218;
        --t-body: #2C4A3C;
        --sh-md: 0 4px 14px rgba(0,0,0,.08);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Outfit', sans-serif;
        background: var(--canvas);
        color: var(--t-body);
        overflow: hidden;
    }

    .tracking-container {
        display: grid;
        grid-template-columns: 1fr 350px;
        height: 100vh;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    .sidebar {
        background: var(--base);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        box-shadow: -2px 0 8px rgba(0,0,0,0.08);
    }

    .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--t-head);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .sidebar-title i {
        color: var(--brand);
    }

    .sidebar-content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
    }

    .info-section {
        margin-bottom: 20px;
    }

    .info-label {
        font-size: 11px;
        color: var(--t-body);
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 8px;
        opacity: 0.7;
    }

    .info-value {
        font-size: 14px;
        font-weight: 600;
        color: var(--t-head);
    }

    .status-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        margin-top: 8px;
        text-transform: capitalize;
    }

    .status-in_transit {
        background: #DBEAFE;
        color: #1E40AF;
    }

    .progress-bar {
        width: 100%;
        height: 6px;
        background: var(--surface);
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: var(--brand);
        border-radius: 3px;
        transition: width 0.3s var(--ease);
    }

    .timeline {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .timeline-item {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
    }

    .timeline-dot {
        width: 12px;
        height: 12px;
        background: var(--brand);
        border-radius: 50%;
        flex-shrink: 0;
        margin-top: 4px;
    }

    .timeline-content {
        font-size: 12px;
    }

    .timeline-time {
        font-weight: 600;
        color: var(--t-head);
    }

    .timeline-desc {
        color: var(--t-body);
        opacity: 0.7;
        font-size: 11px;
    }

    .button-group {
        display: flex;
        gap: 10px;
        padding: 20px;
        border-top: 1px solid var(--border);
    }

    .btn {
        flex: 1;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s var(--ease);
        font-size: 12px;
    }

    .btn-primary {
        background: var(--brand);
        color: white;
    }

    .btn-primary:hover {
        background: var(--brand-dark);
    }

    .btn-secondary {
        background: var(--surface);
        color: var(--brand);
        border: 1px solid var(--brand);
    }

    @media (max-width: 768px) {
        .tracking-container {
            grid-template-columns: 1fr;
        }

        .sidebar {
            display: none;
        }
    }

    /* Leaflet custom styles */
    .leaflet-control-container {
        font-family: 'Outfit', sans-serif;
    }

    .ambulance-marker {
        width: 40px;
        height: 40px;
        background: #FF6B6B;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
        box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
        transform: translate(-50%, -50%);
    }

    .destination-marker {
        width: 32px;
        height: 32px;
        background: #0B9B7A;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 16px;
        transform: translate(-50%, -50%);
    }
    </style>
</head>
<body>
<div class="tracking-container">
    <div id="map"></div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">
                <i class="fas fa-map"></i>
                Live Tracking
            </h2>
        </div>

        <div class="sidebar-content">
            <div class="info-section">
                <div class="info-label">Ambulance</div>
                <div class="info-value" id="ambulance-number">AMB-001</div>
            </div>

            <div class="info-section">
                <div class="info-label">Status</div>
                <span class="status-badge status-in_transit" id="ambulance-status">In Transit</span>
            </div>

            <div class="info-section">
                <div class="info-label">Current Location</div>
                <div class="info-value" id="current-location">Loading...</div>
            </div>

            <div class="info-section">
                <div class="info-label">Speed</div>
                <div class="info-value"><span id="ambulance-speed">0</span> km/h</div>
            </div>

            <div class="info-section">
                <div class="info-label">Destination</div>
                <div class="info-value" id="destination">Loading...</div>
            </div>

            <div class="info-section">
                <div class="info-label">ETA</div>
                <div class="info-value" id="eta">--</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 45%;"></div>
                </div>
            </div>

            <div class="timeline">
                <div class="info-label" style="margin-bottom: 12px;">Journey Timeline</div>
                <div id="timeline-list">
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            <div class="timeline-time">00:00</div>
                            <div class="timeline-desc">Allocation created</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="updateTracking()">
                <i class="fas fa-sync"></i> Refresh
            </button>
            <button class="btn btn-secondary" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>
    </div>
</div>

<script>
    // Initialize map
    const map = L.map('map').setView([20.5937, 78.9629], 6); // India center
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    let ambulanceMarker, destinationMarker, routePath;
    const ambulanceId = new URLSearchParams(window.location.search).get('id') || 1;

    // Sample data - in production, fetch from backend
    const mockData = {
        ambulance_number: 'AMB-001',
        status: 'in_transit',
        current_location: { lat: 20.5956, lon: 78.8711, name: 'Central Hospital' },
        destination: { lat: 20.6245, lon: 78.9450, name: 'District Medical Center' },
        speed: 52,
        eta_minutes: 12,
        progress: 60,
        tracking_history: [
            { lat: 20.5956, lon: 78.8711, time: '10:15', status: 'Picked up patient' },
            { lat: 20.6050, lon: 78.8800, time: '10:22', status: 'En route' },
            { lat: 20.6100, lon: 78.8900, time: '10:25', status: 'En route' },
            { lat: 20.6150, lon: 78.9050, time: '10:28', status: 'En route' }
        ]
    };

    function initializeMap() {
        // Add ambulance marker
        ambulanceMarker = L.circleMarker(
            [mockData.current_location.lat, mockData.current_location.lon],
            {
                radius: 8,
                fillColor: '#FF6B6B',
                color: '#CC0000',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }
        ).addTo(map);

        // Add destination marker
        destinationMarker = L.circleMarker(
            [mockData.destination.lat, mockData.destination.lon],
            {
                radius: 8,
                fillColor: '#0B9B7A',
                color: '#087A60',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }
        ).addTo(map);

        // Draw route
        const routeCoords = [[mockData.current_location.lat, mockData.current_location.lon],
                             [mockData.destination.lat, mockData.destination.lon]];
        routePath = L.polyline(routeCoords, { color: '#FF6B6B', weight: 3, opacity: 0.7 }).addTo(map);

        // Fit bounds
        const bounds = L.latLngBounds(routeCoords);
        map.fitBounds(bounds, { padding: [50, 50] });

        // Update sidebar
        updateSidebar();
    }

    function updateSidebar() {
        document.getElementById('ambulance-number').textContent = mockData.ambulance_number;
        document.getElementById('ambulance-status').textContent = mockData.status;
        document.getElementById('current-location').textContent = mockData.current_location.name;
        document.getElementById('ambulance-speed').textContent = mockData.speed;
        document.getElementById('destination').textContent = mockData.destination.name;
        document.getElementById('eta').textContent = mockData.eta_minutes + ' min';
        document.getElementById('progress-fill').style.width = mockData.progress + '%';
    }

    function updateTracking() {
        // Simulate location update
        console.log('Updating tracking data...');
        alert('Tracking updated!');
    }

    function goBack() {
        window.history.back();
    }

    // Initialize on load
    window.addEventListener('load', initializeMap);
</script>
</body>
</html>
